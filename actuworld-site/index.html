  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ActuWorld",
    "url": "https://www.actuworld.fr",
    "logo": "https://www.actuworld.fr/logo.svg",
    "description": "Le réseau de l'information vérifiée",
    "foundingDate": "2024",

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ActuWorld",
    "url": "https://www.actuworld.fr",
    "inLanguage": "fr"
  }
  </script>
  <!-- Fond critique avant le chargement du CSS (évite le flash blanc) -->
  <style>html{background:#FAF4EB}html.dark{background:#0F1512}</style>
  <script>
    try {
      var t = localStorage.getItem('actuworld-theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F1512');
      }
    } catch (e) {}
  </script>
</head>

  <body class="bg-aw-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
